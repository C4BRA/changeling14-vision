[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "changeling14-vision"
version = "0.1.0"
description = "Changeling14 Vision: an open SS14 vision encoder, its dataset pipeline and training code"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "pillow>=10",
    "pyyaml>=6",
]

[project.optional-dependencies]
train = [
    "torch>=2.4",
    "numpy>=1.26",
    "safetensors>=0.4",
    "schedulefree>=1.4",
]
live = [
    "mss>=9.0",
    "opencv-python>=4.9",
]
text = [
    "sentence-transformers>=3.0",
]
export = [
    "onnx>=1.16",
    "onnxruntime>=1.18",
    "mlx>=0.22; sys_platform == 'darwin'",
    "coremltools>=8.0; sys_platform == 'darwin'",
]
dev = ["pytest>=8"]

[project.scripts]
changeling14-vision = "changeling14_vision.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
